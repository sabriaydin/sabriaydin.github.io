<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1e1e21">
<title>Sayfa bulunamadı | Sabri Aydın</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b72a25'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3' fill='%23efede9'/%3E%3C/svg%3E">
<!-- Bu sayfa her adreste çalışsın diye tek başına yeterlidir: dış CSS/JS dosyası kullanmaz. -->
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#1e1e21;color:#e9e6e1;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:520px;padding:44px 40px;background:#e7e4df;color:#1c1c1e;border-radius:10px;border-left:6px solid #a8231f;text-align:left}
.code{font-size:3.5rem;font-weight:800;line-height:1;color:#b72a25;letter-spacing:-.02em}
h1{font-size:1.8rem;line-height:1.2;margin:14px 0 10px;letter-spacing:-.01em}
p{color:#5b5853;margin-bottom:26px}
.code{margin-bottom:0}
a{display:inline-block;padding:11px 20px;border-radius:10px;background:#b72a25;color:#fff;font-weight:700;text-decoration:none}
a:hover{background:#9a211d}a:focus-visible{outline:2px solid #ec6a63;outline-offset:2px}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true">404</p>
<h1>Sayfa bulunamadı</h1>
<p>Aradığın sayfa yok ya da taşınmış.</p>
<a id="home" href="/">Ana sayfaya dön</a>
</main>
<script>
// GitHub Pages proje sitelerinde ana sayfa /depo-adi/ altındadır; kullanıcı sitelerinde ve özel alan adlarında kökte.
function siteBase(host,path){
  var seg=path.split('/');
  if(/\.github\.io$/.test(host)&&seg.length>2&&seg[1]!=='posts'&&seg[1]!=='assets')return '/'+seg[1]+'/';
  return '/';
}
document.getElementById('home').href=siteBase(location.hostname,location.pathname);
</script>
</body>
</html>
