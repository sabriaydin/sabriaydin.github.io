<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABRİ AYDIN | Yazı</title>
    <link rel="stylesheet" href="/blog/style.css?v=1">
</head>
<body>
    
    <!-- Header Buraya Gelecek -->
    <div id="header-placeholder"></div>

    <main class="single-post">
        <!-- Geri Dön Butonu -->
        <a href="index.html" class="back-btn" style="display:inline-block; margin-bottom:20px; color:var(--gray-light); font-weight:500; transition: color 0.3s;">&larr; Ana Sayfaya Dön</a>
        
        <article class="post-card" style="border-left:none; border-top: 5px solid var(--accent-red);">
            
            <header style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">
                <h1 style="font-size: 2.5rem; color: var(--text-white); margin-bottom: 10px;">Buraya Ana Başlığı Yazın</h1>
                <span class="date" style="color: var(--accent-red); font-weight: 600;">11 Haziran 2026</span>
            </header>
            
            <div class="single-post-content" style="font-size: 1.1rem; line-height: 1.8; color: #000;">
                <p>Yazınızın içeriğini buraya ekleyin. Yeni paragraflar için <b>&lt;p&gt;</b> etiketlerini kullanın.</p>
                <p>Görsel eklemek isterseniz standart <b>&lt;img&gt;</b> etiketini kullanabilirsiniz.</p>
            </div>

        </article>
    </main>

    <!-- Footer Buraya Gelecek -->
    <div id="footer-placeholder"></div>

    <script src="/blog/script.js?v=1"></script>
</body>
</html>
