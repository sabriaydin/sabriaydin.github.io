# Sitedeki dış bağlantıları haftalık olarak kontrol eder, kırık bağlantı bulunursa
# bu iş kırmızı (başarısız) görünür ve Actions sekmesinde hangi dosyada hangi
# bağlantının sorunlu olduğu listelenir. Elle çalıştırmak için Actions sekmesinden
# "Bağlantıları kontrol et" iş akışını seçip "Run workflow" kullanabilirsin.
name: Bağlantıları kontrol et

on:
  schedule:
    - cron: '0 6 * * 1' # her Pazartesi 06:00 UTC (TR saatiyle 09:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dış bağlantıları kontrol et
        run: node scripts/check-links.mjs
