# Siteyi her güncellemede otomatik yayınlar.
# Yazı ekleyip/silip/değiştirip depoya yüklediğinde yazı listesi, site haritası ve RSS kendiliğinden güncellenir.
# Tek seferlik ayar: Settings > Pages > Build and deployment > Source: "GitHub Actions"
name: Siteyi yayınla

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Pages ayarlarını oku
        id: pages
        uses: actions/configure-pages@v5

      - name: Yazı listesini, site haritasını ve RSS'i üret
        run: node scripts/build.mjs --deploy _site --base "${{ steps.pages.outputs.base_url }}"

      - name: Yayın paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
